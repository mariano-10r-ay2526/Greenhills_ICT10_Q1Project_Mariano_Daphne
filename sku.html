<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Quarter Project</title>

    <!-- EXTERNAL LINKS -->

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>


    <!-- NAVBAR -->
    <nav class="navbar text-center py-3 bg-dark text-light">
        <ul class="nav-menu">
            <li>
                <a href="sku.html" class="active">SKU Generator</a>
            </li>

            <li>
                <a href="index.html" class="#">Receipt Generator</a>
            </li>
        </ul>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6">
                <h2 style="text-align: center;">OBMC Entrep Fair Menu</h2>
            </div>
        </div>
    </div>


    <!-- SKU GENERATOR -->
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6">
                <h2 class="text-center">SKU Generator</h2>

            <label for="category">Category</label>
                <select id="category" class="form-select mb-3">
                    <option value="MD">Main Dish</option>
                    <option value="SD">Side Dish</option>
                    <option value="SODA">Beverage</option>
                </select>

            <label for="product">Product Name</label>
                <select id="product" class="form-select mb-3">
                    <option value="FC">Fried Chicken</option>
                    <option value="CB">Cheeseballs</option>
                    <option value="CC">Coca Cola</option>
                </select>

        <label for="stock">Stock Quantity</label>
        <input type="number" id="stock" class="form-control mb-3" placeholder="Enter stock quantity" min="1">

        <div class="text-center mb-4">
            <button type="button" class="btn btn-dark" py-click="generate_sku">Generate SKU</button>
        </div>

    <h2 style="text-align: center;">Generated SKU</h2>
    <div id="result" style="text-align: center;"></div>


    <py-script src="main.py"></py-script>
</body>
</html>
